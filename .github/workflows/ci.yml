name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit, Type, Lint, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VENDOR_CATALOG_TEST_DATABASE_URL: postgresql://cmp_test:cmp_test@127.0.0.1:5432/cmp_catalog_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cmp_test
          POSTGRES_PASSWORD: cmp_test
          POSTGRES_DB: cmp_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmp_test -d cmp_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and parity tests
        run: npm test

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

  browser:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Authenticated production browser tests
        run: npm run test:e2e:auth

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
